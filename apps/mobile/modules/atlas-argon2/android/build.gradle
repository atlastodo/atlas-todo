plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.atlasargon2'
version = '1.0.0'

android {
  namespace "expo.modules.atlasargon2"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // The same Bouncy Castle line expo-updates already brings in (bcutil-jdk15to18 depends on it):
  // a second line, such as jdk18on, would put the same classes in the app twice and fail the build.
  implementation("org.bouncycastle:bcprov-jdk15to18:1.81")
}
