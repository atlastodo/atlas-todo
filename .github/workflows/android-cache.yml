# Fills the Android build caches that release.yml's Android job reads. A run can only read caches
# saved on its own ref or on the default branch, so what one tag run saved is invisible to the
# next tag: this unsigned build on main writes them instead (Gradle through setup-gradle, plus
# the NDK/CMake packages and ccache; see .github/actions/android-setup). It runs when main moves
# (each stable release merge), weekly so the caches are not evicted after seven idle days, and
# by hand. It uses no secrets: the prebuilt project's release config signs with the debug key.
name: Android cache

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "bun.lock"
      - ".github/actions/android-setup/**"
      - ".github/scripts/android-gradle.sh"
      - ".github/workflows/android-cache.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-cache
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "26"

jobs:
  build:
    name: Android cache
    # Caches saved anywhere else are unreadable by tag runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # As release.yml's Android job, so the cached outputs match the tag's build.
    env:
      ATLAS_APP_ID: ${{ vars.ATLAS_APP_ID }}
      ATLAS_EAS_PROJECT_ID: ${{ vars.ATLAS_EAS_PROJECT_ID }}
      EXPO_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/android-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build the unsigned APK and AAB
        working-directory: apps/mobile/android
        run: ../../../.github/scripts/android-gradle.sh
      # setup-gradle saves ~/.gradle in its post step; these two are saved here.
      - if: steps.setup.outputs.sdk-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.sdk-paths }}
          key: ${{ steps.setup.outputs.sdk-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-android-${{ runner.os }}-${{ github.run_id }}
