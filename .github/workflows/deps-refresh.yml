# Weekly refresh of everything Dependabot can't update (scripts/update-deps.sh: devenv and flake
# locks, the Bun pins, the whole bun.lock, the Expo SDK's packages, Cargo.lock, nix/bun.nix),
# opened as one PR to `dev` from the `chore/deps-refresh` branch, which each run rebuilds.
#
# The refresh runs code no reviewed lock pins yet (the packages and tools it just resolved), so:
# - It runs on `dev`, never in the default branch's cache scope: a schedule starts on `main`, and
#   only dispatches the run on `dev`. A tag run (the signed release) can read caches of `main` and
#   its own ref only, so nothing the refresh's processes might save can reach the release.
# - That job has a read-only token and no persisted git credentials. It hands its changes on as a
#   patch; the job that pushes, opens the PR and dispatches CI runs none of the refreshed code.
#
# A PR opened with GITHUB_TOKEN starts no workflow runs, so CI is dispatched on the branch by hand;
# its checks land on the PR's head commit. Opening the PR needs the repository setting "Allow
# GitHub Actions to create and approve pull requests".
name: Dependency refresh

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deps-refresh-${{ github.ref }}
  cancel-in-progress: false

env:
  BRANCH: chore/deps-refresh

jobs:
  # Started anywhere but `dev` (the schedule runs on `main`): run again on `dev`.
  dispatch:
    name: Run on dev
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deps-refresh.yml --ref dev --repo "$GITHUB_REPOSITORY"

  refresh:
    name: Refresh dependencies
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      expo-current: ${{ steps.expo.outputs.current }}
      expo-latest: ${{ steps.expo.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # `cargo update` for the atlas-todo CLI (crates/).
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - name: Update
        env:
          # Read-only: for GitHub API rate limits (flake inputs), never for writing.
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-deps.sh
      - id: patch
        name: Save the changes
        run: |
          git add -A
          git diff --cached --binary >"$RUNNER_TEMP/refresh.patch"
          if [ -s "$RUNNER_TEMP/refresh.patch" ]; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "Everything is current"
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-patch
          path: ${{ runner.temp }}/refresh.patch
          retention-days: 3
      # A new Expo SDK major is a migration (React Native, React and the native modules move
      # together), so it is flagged as an issue rather than applied (by the next job).
      - id: expo
        name: Check for a new Expo SDK
        run: |
          current="$(bun -e "console.log(require('./apps/mobile/node_modules/expo/package.json').version.split('.')[0])" 2>/dev/null)" || exit 0
          latest="$(npm view expo version | cut -d. -f1)"
          echo "current=$current" >>"$GITHUB_OUTPUT"
          echo "latest=$latest" >>"$GITHUB_OUTPUT"

  publish:
    name: Open the PR
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
    steps:
      - if: needs.refresh.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - if: needs.refresh.outputs.changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refresh-patch
          path: ${{ runner.temp }}
      - name: Open or update the PR
        if: needs.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git apply --binary "$RUNNER_TEMP/refresh.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -aqm "chore(deps): weekly dependency refresh"
          git push -f origin "$BRANCH"
          {
            echo "Weekly run of \`scripts/update-deps.sh\` ([log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
            echo
            echo '```'
            git show --stat --format= HEAD
            echo '```'
          } >"$RUNNER_TEMP/body.md"
          if [ -n "$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base dev --head "$BRANCH" --title "chore(deps): weekly dependency refresh" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
      - name: Flag a new Expo SDK
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ needs.refresh.outputs.expo-current }}
          LATEST: ${{ needs.refresh.outputs.expo-latest }}
        run: |
          # Both are major versions the previous job read; anything else is skipped.
          case "$CURRENT" in "" | *[!0-9]*) exit 0 ;; esac
          case "$LATEST" in "" | *[!0-9]*) exit 0 ;; esac
          [ "$LATEST" -gt "$CURRENT" ] || exit 0
          title="Upgrade to Expo SDK $LATEST"
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "Expo SDK $LATEST is out; \`apps/mobile\` is on SDK $CURRENT. Upgrade with \`bunx expo install expo@^$LATEST --fix\` and follow the SDK's upgrade guide."
          fi
