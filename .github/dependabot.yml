# Weekly dependency updates. Minor/patch bumps arrive as one grouped PR per ecosystem; majors
# stay separate so each gets its own review. Commit prefixes follow Conventional Commits.
#
# Version updates target `dev`, where work lands (`main` takes only the release PR from dev). They
# wait three days after a release (`cooldown`), a buffer against hijacked releases; security
# updates (a repository setting, not this file) never wait and always target the default branch,
# `main`. A bun PR's `nix/bun.nix` is regenerated by the `Dependabot bun.nix` workflow.
#
# What Dependabot can't update (devenv/flake locks, the Bun pins, transitive dependencies and
# overrides, the Expo SDK's packages, the core pin) is refreshed weekly by `deps-refresh.yml`.
version: 2
updates:
  - package-ecosystem: github-actions
    # The root covers .github/workflows; the composite actions need listing.
    directories: ["/", "/.github/actions/*"]
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Bun workspace (root bun.lock covers apps/*). Bun itself follows the devenv nixpkgs, moved by
  # deps-refresh.yml.
  - package-ecosystem: bun
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      bun-minor-patch:
        update-types: [minor, patch]
    # Moved by deps-refresh.yml instead: the core pin (one exact version across apps/mobile and
    # devenv's server image) and the packages whose versions the Expo SDK decides (its
    # bundledNativeModules.json, applied by `expo install --fix`; a new SDK is a migration).
    ignore:
      - dependency-name: "@atlastodo/*"
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "@react-native/*"
      - dependency-name: "react-native-web"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-svg"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/datetimepicker"
      # The one real hold: nativewind 4 is built on Tailwind 3, and Tailwind 4 needs nativewind 5,
      # which is only a release candidate so far. Drop this with the move to a stable nativewind 5.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
