# Weekly dependency updates. Minor/patch bumps arrive as one grouped PR per ecosystem; majors
# stay separate so each gets its own review. Commit prefixes follow Conventional Commits.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Bun workspace (root bun.lock covers apps/* and packages/*). Bun itself is pinned in lockstep
  # across devenv, the workflows and docker/Dockerfile, so Dependabot doesn't touch it.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      bun-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
