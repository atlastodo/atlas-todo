[workspace]
resolver = "2"
members = ["crates/atlas-todo-rules", "crates/atlas-todo-cli"]

[workspace.package]
version = "0.1.18"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/atlastodo/atlas-todo"
homepage = "https://github.com/atlastodo/atlas-todo"
rust-version = "1.94"

[workspace.dependencies]
# Atlas core's engine, from a core release tag (scripts/update-deps.sh moves it with the npm pin).
atlas-client = { git = "https://github.com/atlastodo/atlas", tag = "v0.1.16" }
atlas-core = { git = "https://github.com/atlastodo/atlas", tag = "v0.1.16" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
jiff = { version = "0.2", default-features = false, features = [
    "std",
    "tz-system",
    "tz-fat",
    "tzdb-zoneinfo",
    "tzdb-bundle-always",
] }

# The client's tests run PBKDF2 and Argon2 (sign-in), many times slower unoptimized.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3
