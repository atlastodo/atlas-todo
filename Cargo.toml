[workspace]
resolver = "2"
members = ["crates/atlas-core", "crates/atlas-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/atlastodo/atlas-todo"
homepage = "https://github.com/atlastodo/atlas-todo"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v5", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
